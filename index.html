<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Happy Birthday Mila Salsa ❤️ | Romantic Surprise</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #050505;
      color: #fff;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, #0a0008, #030001, #000000);
      z-index: -2;
    }
    .bg-gradient::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, rgba(255, 79, 163, 0.03) 0px, rgba(255, 79, 163, 0.03) 2px, transparent 2px, transparent 8px);
      pointer-events: none;
    }

    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      z-index: -1;
      pointer-events: none;
    }
    .glow1 { width: 60vw; height: 60vw; background: #ff4fa3; top: -20vh; left: -30vw; }
    .glow2 { width: 70vw; height: 70vw; background: #ff1493; bottom: -30vh; right: -20vw; }
    .glow3 { width: 50vw; height: 50vw; background: #b87cff; top: 40%; left: 20%; }

    /* Password screen */
    #passwordScreen {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 5, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    .password-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 79, 163, 0.5);
      border-radius: 40px;
      padding: 40px 30px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 40px rgba(255, 79, 163, 0.3);
    }
    .password-box h1 {
      font-family: 'Playfair Display', serif;
      color: #ff4fa3;
      text-shadow: 0 0 15px #ff4fa3;
      margin-bottom: 10px;
    }
    .password-box input {
      width: 100%;
      padding: 14px;
      margin: 20px 0;
      background: rgba(255,255,255,0.1);
      border: 1px solid #ff4fa3;
      border-radius: 60px;
      color: white;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }
    .password-box button {
      background: linear-gradient(135deg, #ff4fa3, #ff1493);
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px #ff4fa3;
    }
    .password-box button:hover { transform: scale(1.05); }

    /* Floating petals & sparkles */
    .petal, .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes fall {
      0% { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1); }
    }
    .sparkle {
      animation: twinkle 2s infinite ease-in-out;
    }

    /* Page transition */
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.5s ease;
      opacity: 1;
      transform: translateY(0);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 79, 163, 0.4);
      border-radius: 48px;
      padding: 40px 30px;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: 0 0 40px rgba(255, 79, 163, 0.2);
      text-align: center;
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
      color: #ff4fa3;
      text-shadow: 0 0 12px #ff4fa3;
    }
    .neon-text {
      text-shadow: 0 0 8px #ff4fa3, 0 0 18px #ff1493;
    }

    /* Countdown */
    .countdown-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 30px 0;
    }
    .time-box {
      background: rgba(0,0,0,0.6);
      border: 1px solid #ff4fa3;
      border-radius: 24px;
      padding: 20px;
      min-width: 80px;
      text-align: center;
      box-shadow: 0 0 15px #ff4fa3;
    }
    .time-number {
      font-size: 3rem;
      font-weight: bold;
      color: #ff4fa3;
    }

    /* Gallery - Portrait mode */
    .swiper {
      width: 100%;
      border-radius: 32px;
      overflow: hidden;
    }
    .swiper-slide {
      display: flex;
      justify-content: center;
      background: transparent;
    }
    .gallery-img {
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4; /* Portrait ratio 3:4, tinggi lebih besar */
      object-fit: cover;
      border-radius: 32px;
      box-shadow: 0 0 20px rgba(255,79,163,0.3);
      transition: transform 0.3s;
    }
    .gallery-img:hover {
      transform: scale(1.02);
    }
    .swiper-button-next, .swiper-button-prev {
      color: #ff4fa3 !important;
    }

    /* Reasons grid */
    .reasons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .reason-card {
      background: rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 20px;
      border: 1px solid rgba(255,79,163,0.3);
      transition: 0.3s;
    }
    .reason-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px #ff4fa3;
    }

    /* Spotify-style music player */
    .spotify-player {
      background: rgba(0,0,0,0.8);
      border-radius: 20px;
      padding: 20px;
      margin: 20px auto;
      max-width: 350px;
      text-align: center;
      border: 1px solid #ff4fa3;
      box-shadow: 0 0 20px rgba(255,79,163,0.3);
    }
    .album-art {
      width: 180px;
      height: 180px;
      border-radius: 20px;
      margin: 0 auto 15px;
      overflow: hidden;
    }
    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .progress-container {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 4px;
      cursor: pointer;
      margin: 15px 0;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: #ff4fa3;
      border-radius: 4px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 15px;
    }
    .controls button {
      background: none;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .equalizer-bars {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 15px;
    }
    .equalizer-bars span {
      width: 4px;
      height: 12px;
      background: #ff4fa3;
      border-radius: 2px;
      animation: equalize 0.8s infinite ease alternate;
    }
    @keyframes equalize {
      0% { height: 8px; }
      100% { height: 22px; }
    }

    .bunny {
      font-size: 5rem;
      filter: drop-shadow(0 0 15px #ff4fa3);
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-15px); }
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      padding: 8px 20px;
      display: flex;
      gap: 20px;
      z-index: 100;
      border: 1px solid rgba(255,79,163,0.5);
    }
    .nav-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 8px;
      transition: 0.2s;
    }
    .nav-btn.active {
      color: #ff4fa3;
      text-shadow: 0 0 8px #ff4fa3;
    }
    .progress-indicator {
      position: fixed;
      bottom: 100px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 100;
    }
    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      transition: 0.3s;
    }
    .progress-dot.active {
      width: 24px;
      background: #ff4fa3;
      box-shadow: 0 0 8px #ff4fa3;
    }

    @media (max-width: 680px) {
      .glass-card { padding: 30px 20px; }
      .time-number { font-size: 2rem; }
      .album-art { width: 140px; height: 140px; }
    }
  </style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="glow-orb glow1"></div>
<div class="glow-orb glow2"></div>
<div class="glow-orb glow3"></div>

<div id="passwordScreen">
  <div class="password-box">
    <h1>✨ Secret Love Letter ✨</h1>
    <p>Enter password to unlock the surprise</p>
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
    <button onclick="checkPassword()">Unlock ❤️</button>
  </div>
</div>

<main id="app"></main>

<script>
  const pages = [
    { id: 'hero' }, { id: 'countdown' }, { id: 'music' },
    { id: 'gallery' }, { id: 'loveletter' }, { id: 'reasons' }, { id: 'final' }
  ];
  let currentIndex = 0;
  let swiperGallery = null;
  let audioElement = null;
  let progressInterval = null;
  const birthdayDate = new Date(2026, 4, 25, 0, 0, 0);

  const templates = {
    hero: `
      <div class="glass-card">
        <h1 class="neon-text" style="font-size: 3rem;">Happy Birthday<br>Mila Salsa ❤️</h1>
        <p style="margin: 20px 0; font-size: 1.2rem;">You are my today and all of my tomorrows.</p>
        <div style="margin: 30px auto; width: 200px; height: 200px; border-radius: 50%; overflow: hidden; border: 3px solid #ff4fa3; box-shadow: 0 0 30px #ff4fa3;">
          <img src="https://placehold.co/400x400/ff4fa3/ffffff?text=Couple+Photo" style="width:100%; height:100%; object-fit:cover;" alt="couple">
        </div>
        <button class="next-btn" style="background: linear-gradient(135deg,#ff4fa3,#ff1493); border:none; padding:12px 32px; border-radius:40px; color:white; font-weight:bold; margin-top:20px; cursor:pointer;">Open Surprise 💌</button>
      </div>
    `,
    countdown: `
      <div class="glass-card">
        <h2 class="neon-text">✨ Countdown to Your Birthday ✨</h2>
        <div class="countdown-container">
          <div class="time-box"><div class="time-number" id="days">0</div><div class="time-label">Hari</div></div>
          <div class="time-box"><div class="time-number" id="hours">0</div><div class="time-label">Jam</div></div>
          <div class="time-box"><div class="time-number" id="minutes">0</div><div class="time-label">Menit</div></div>
          <div class="time-box"><div class="time-number" id="seconds">0</div><div class="time-label">Detik</div></div>
        </div>
        <p style="margin-top: 20px;">Another year of beautiful life. Another year of loving you.</p>
      </div>
    `,
    music: `
      <div class="glass-card">
        <h2 class="neon-text">🎵 Our Song 🎵</h2>
        <div class="spotify-player">
          <div class="album-art"><img src="https://i.scdn.co/image/ab67616d0000b27350a3147b4edd7701a876c6ce" alt="Perfect"></div>
          <div class="song-title">Perfect</div>
          <div class="artist-name">Ed Sheeran</div>
          <div class="progress-container" id="progressContainer"><div class="progress-bar" id="musicProgressBar"></div></div>
          <div class="time-info" style="display:flex; justify-content:space-between; font-size:0.7rem;"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
          <div class="controls"><button id="prevBtnMusic">⏮️</button><button id="playPauseBtnMusic">▶️</button><button id="nextBtnMusic">⏭️</button></div>
          <div class="equalizer-bars" id="equalizer"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </div>
    `,
    gallery: `
      <div class="glass-card" style="padding: 20px;">
        <h2 class="neon-text">📸 Beautiful Memories</h2>
        <div class="swiper mySwiper" style="margin-top: 20px;">
          <div class="swiper-wrapper">
            <div class="swiper-slide"><img class="gallery-img" src="https://placehold.co/600x800/ff4fa3/ffffff?text=Memory+1" alt="memori1"></div>
            <div class="swiper-slide"><img class="gallery-img" src="https://placehold.co/600x800/ff1493/ffffff?text=Memory+2" alt="memori2"></div>
            <div class="swiper-slide"><img class="gallery-img" src="https://placehold.co/600x800/b87cff/ffffff?text=Memory+3" alt="memori3"></div>
          </div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </div>
      </div>
    `,
    loveletter: `
      <div class="glass-card">
        <h2 class="neon-text">💌 A Letter For You</h2>
        <div id="envelope" style="cursor:pointer; margin:20px auto; width:120px; height:90px; background:#ff4fa3; border-radius:10px; position:relative; box-shadow:0 0 20px #ff4fa3;">
          <div style="position:absolute; top:0; left:0; width:100%; height:100%; background:#ff1493; clip-path: polygon(0 0, 100% 0, 50% 100%);"></div>
          <div style="position:absolute; bottom:10px; left:0; right:0; text-align:center; color:white;">✉️</div>
        </div>
        <div id="letterContent" style="display:none; background:white; color:#222; border-radius:20px; padding:20px; text-align:left; max-height:300px; overflow-y:auto;">
          <p>💖 Untuk Mila Salsa tercinta,<br><br>Selamat ulang tahun sayang! 🎂 Kamu adalah hadiah terindah dalam hidupku... <br><br>I love you more than words can say. ❤️</p>
        </div>
      </div>
    `,
    reasons: `
      <div class="glass-card">
        <h2 class="neon-text">💖 Reasons I Love You</h2>
        <div class="reasons-grid">
          <div class="reason-card">🌸 Kamu selalu ada untuk aku</div><div class="reason-card">😊 Kamu bikin aku bahagia</div>
          <div class="reason-card">👸 Kamu cantik luar dalam</div><div class="reason-card">🏠 Kamu rumah terbaikku</div>
          <div class="reason-card">👭 Kamu sahabat terbaikku</div><div class="reason-card">🌟 Kamu membuat hidupku berarti</div>
          <div class="reason-card">💪 Kamu inspirasiku</div><div class="reason-card">💭 Kamu selalu di pikiranku</div>
        </div>
      </div>
    `,
    final: `
      <div class="glass-card">
        <h2 class="neon-text">Thank you for being born<br>and being part of my life ❤️</h2>
        <div class="bunny">🐰✨💖</div>
        <button id="replayBtn" style="background: linear-gradient(135deg,#ff4fa3,#ff1493); border:none; padding:12px 32px; border-radius:40px; color:white; cursor:pointer;">Replay Our Story 🔄</button>
      </div>
    `
  };

  function renderPage(index) {
    const app = document.getElementById('app');
    const pageId = pages[index].id;
    app.innerHTML = templates[pageId];
    if (pageId === 'hero') document.querySelector('.next-btn')?.addEventListener('click', () => changePage(1));
    if (pageId === 'countdown') startCountdown();
    if (pageId === 'music') initMusicPlayer();
    if (pageId === 'gallery') {
      if (swiperGallery) swiperGallery.destroy(true, true);
      swiperGallery = new Swiper('.mySwiper', {
        navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
        loop: true,
        effect: 'slide'
      });
    }
    if (pageId === 'loveletter') {
      document.getElementById('envelope')?.addEventListener('click', () => {
        document.getElementById('envelope').style.display = 'none';
        document.getElementById('letterContent').style.display = 'block';
      });
    }
    if (pageId === 'final') document.getElementById('replayBtn')?.addEventListener('click', () => { currentIndex = 0; renderPage(0); updateNavAndProgress(); });
    updateNavAndProgress();
  }

  function startCountdown() {
    const update = () => {
      const diff = birthdayDate - new Date();
      if (diff <= 0) { clearInterval(countdownInterval); return; }
      document.getElementById('days').innerText = Math.floor(diff / (1000*60*60*24));
      document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000);
      document.getElementById('minutes').innerText = Math.floor((diff % 3600000) / 60000);
      document.getElementById('seconds').innerText = Math.floor((diff % 60000) / 1000);
    };
    update();
    const countdownInterval = setInterval(update, 1000);
  }

  function initMusicPlayer() {
    if (!audioElement) {
      audioElement = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
      audioElement.loop = true;
    }
    const playPause = document.getElementById('playPauseBtnMusic');
    const progressBar = document.getElementById('musicProgressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const eq = document.getElementById('equalizer');
    
    const format = (s) => `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
    audioElement.addEventListener('loadedmetadata', () => durationSpan.innerText = format(audioElement.duration));
    audioElement.addEventListener('timeupdate', () => {
      const percent = (audioElement.currentTime / audioElement.duration) * 100;
      progressBar.style.width = percent + '%';
      currentTimeSpan.innerText = format(audioElement.currentTime);
    });
    playPause.onclick = () => {
      if (audioElement.paused) { audioElement.play(); playPause.innerHTML = '⏸️'; eq.style.opacity = 1; }
      else { audioElement.pause(); playPause.innerHTML = '▶️'; eq.style.opacity = 0.5; }
    };
    progressContainer.onclick = (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      audioElement.currentTime = percent * audioElement.duration;
    };
    document.getElementById('prevBtnMusic').onclick = () => audioElement.currentTime = 0;
    document.getElementById('nextBtnMusic').onclick = () => audioElement.currentTime = 0;
    audioElement.play().then(() => { playPause.innerHTML = '⏸️'; eq.style.opacity = 1; }).catch(() => {});
  }

  function updateNavAndProgress() {
    let navDiv = document.querySelector('.bottom-nav');
    if (!navDiv) {
      navDiv = document.createElement('div'); navDiv.className = 'bottom-nav';
      document.body.appendChild(navDiv);
      const progDiv = document.createElement('div'); progDiv.className = 'progress-indicator';
      document.body.appendChild(progDiv);
    }
    const nav = document.querySelector('.bottom-nav');
    const prog = document.querySelector('.progress-indicator');
    nav.innerHTML = ''; prog.innerHTML = '';
    const icons = ['🏠', '⏰', '🎵', '📸', '💌', '💖', '✨'];
    pages.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.innerText = icons[idx];
      btn.className = 'nav-btn' + (idx === currentIndex ? ' active' : '');
      btn.onclick = () => changePage(idx);
      nav.appendChild(btn);
      const dot = document.createElement('div');
      dot.className = 'progress-dot' + (idx === currentIndex ? ' active' : '');
      prog.appendChild(dot);
    });
    let backNext = document.querySelector('.backnext-container');
    if (!backNext) {
      backNext = document.createElement('div'); backNext.className = 'backnext-container';
      backNext.style.cssText = 'position:fixed; bottom:100px; left:0; right:0; display:flex; justify-content:space-between; padding:0 20px; z-index:100;';
      document.body.appendChild(backNext);
    }
    backNext.innerHTML = `
      <button id="prevBtn" style="background:rgba(0,0,0,0.6); border:1px solid #ff4fa3; padding:8px 20px; border-radius:40px; color:white; ${currentIndex===0?'opacity:0.3;pointer-events:none':''}">← Back</button>
      <button id="nextBtn" style="background:rgba(0,0,0,0.6); border:1px solid #ff4fa3; padding:8px 20px; border-radius:40px; color:white; ${currentIndex===pages.length-1?'opacity:0.3;pointer-events:none':''}">Next ❤️</button>
    `;
    document.getElementById('prevBtn')?.addEventListener('click', () => { if(currentIndex>0) changePage(currentIndex-1); });
    document.getElementById('nextBtn')?.addEventListener('click', () => { if(currentIndex<pages.length-1) changePage(currentIndex+1); });
  }

  function changePage(newIndex) {
    if (newIndex === currentIndex) return;
    const app = document.getElementById('app');
    app.style.opacity = '0';
    app.style.transform = 'translateY(20px)';
    setTimeout(() => {
      currentIndex = newIndex;
      renderPage(currentIndex);
      app.style.opacity = '1';
      app.style.transform = 'translateY(0)';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 300);
  }

  function checkPassword() {
    if (document.getElementById('passwordInput').value === 'mila123') {
      document.getElementById('passwordScreen').style.display = 'none';
      renderPage(0);
      setInterval(() => {
        const petal = document.createElement('div'); petal.className = 'petal'; petal.innerHTML = '🌸';
        petal.style.cssText = `left:${Math.random()*100}%; font-size:${15+Math.random()*20}px; animation:fall ${5+Math.random()*6}s linear forwards; position:fixed; top:-20px; pointer-events:none;`;
        document.body.appendChild(petal); setTimeout(() => petal.remove(), 10000);
      }, 300);
      setInterval(() => {
        const spark = document.createElement('div'); spark.className = 'sparkle'; spark.innerHTML = '✨';
        spark.style.cssText = `left:${Math.random()*100}%; top:${Math.random()*100}%; font-size:${10+Math.random()*15}px; animation:twinkle ${1+Math.random()*2}s infinite; position:fixed; pointer-events:none;`;
        document.body.appendChild(spark); setTimeout(() => spark.remove(), 2000);
      }, 800);
    } else alert('Password salah 💔 Coba lagi');
  }
  window.checkPassword = checkPassword;
</script>
